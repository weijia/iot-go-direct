# .goreleaser.yml
builds:
  - id: iot_go-arm
    binary: iot_go
    main: cmd/cobra_main/main.go cmd/cobra_main/main_loop.go cmd/cobra_main/version_and_supervisord.go cmd/cobra_main/lora_service.go
    goos:
      - linux
    goarch:
      - arm
    env:
      - CGO_ENABLED=1
      - CC=arm-linux-gnueabihf-gcc
      - CXX=arm-linux-gnueabihf-g++
      - PKG_CONFIG_SYSROOT_DIR=/sysroot/linux/armhf
      - C_INCLUDE_PATH=/sysroot/linux/armhf/arm-linux-gnueabihf/libc/usr/include
      - PKG_CONFIG_PATH=/sysroot/linux/armhf/opt/vc/lib/pkgconfig:/sysroot/linux/armhf/usr/lib/arm-linux-gnueabihf/pkgconfig:/sysroot/linux/armhf/usr/lib/pkgconfig:/sysroot/linux/armhf/usr/local/lib/pkgconfig
    flags:
      - -mod=readonly
    ldflags:
      - -s -extldflags " --sysroot=/sysroot/linux/armhf/arm-linux-gnueabihf/libc " -w -X main.version={{.Version}}

  - id: iot_go-win
    binary: iot_go
    main: ./cmd/iot/main.go
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0

before:
  hooks:
    - echo "Running pre-build hook"
    - ./build_arm_lib.sh

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    wrap_in_directory: true

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
