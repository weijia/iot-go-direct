# .goreleaser.yml
builds:
  - id: iot_go-arm
    binary: iot_go
    main: ./cmd/cobra_main/
    goos:
      - linux
    goarch:
      - arm
    env:
      - CGO_ENABLED=1
      - CC=arm-linux-gnueabihf-gcc
      - CXX=arm-linux-gnueabihf-g++
      - PKG_CONFIG_SYSROOT_DIR=/sysroot/linux/armhf
      - C_INCLUDE_PATH=/sysroot/linux/armhf/arm-linux-gnueabihf/libc/usr/include
      - PKG_CONFIG_PATH=/sysroot/linux/armhf/opt/vc/lib/pkgconfig:/sysroot/linux/armhf/usr/lib/arm-linux-gnueabihf/pkgconfig:/sysroot/linux/armhf/usr/lib/pkgconfig:/sysroot/linux/armhf/usr/local/lib/pkgconfig
    flags:
      - -mod=readonly
    ldflags:
      - -s -extldflags " --sysroot=/sysroot/linux/armhf/arm-linux-gnueabihf/libc" -w
      - -X main.BuildDate={{.Date}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.Version={{.Env.VERSION}}

  - id: iot_go-win
    binary: iot_go
    main: ./cmd/cobra_main/
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.BuildDate={{.Date}}
      - -X main.GitCommit={{.ShortCommit}}
      - -X main.Version={{.Env.VERSION}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    wrap_in_directory: true

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
